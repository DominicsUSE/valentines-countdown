name: Build Roblox Optimizer (Windows)

# Builds a ready-to-run Windows executable and publishes it as a GitHub
# Release asset (a plain, public download link - unlike the "Artifacts"
# section, GitHub does NOT require you to be signed in to download a
# release asset from a public repo). Every push replaces the "latest-build"
# release with the newest .exe.

on:
  push:
    branches:
      - claude/roblox-performance-optimizer-lv27xz
    paths:
      - "src/RobloxOptimizer/**"
      - ".github/workflows/build-roblox-optimizer.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish a self-contained, single-file executable
        run: >
          dotnet publish src/RobloxOptimizer/RobloxOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload the executable as a build artifact (backup / CI history)
        uses: actions/upload-artifact@v4
        with:
          name: RobloxOptimizer-win-x64
          path: publish/RobloxOptimizer.exe
          if-no-files-found: error

      - name: Publish (or replace) the "latest-build" GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest-build publish/RobloxOptimizer.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Latest build (auto-updated)" \
            --notes "Automatically built from commit ${{ github.sha }}. This is a rolling build of the claude/roblox-performance-optimizer-lv27xz branch, not a stable versioned release - it gets replaced on every push. Download RobloxOptimizer.exe below - no GitHub sign-in required." \
            --prerelease
